# Weekly, grouped version updates.
# npm: the root package.json and pnpm-lock.yaml hold every dependency (see CLAUDE.md).
# github-actions: the uses: lines in .github/workflows (pinned to commit SHAs).
# Documentation: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
